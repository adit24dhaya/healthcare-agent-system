version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      API_TOKEN: ${API_TOKEN:-dev-token}
      REQUIRE_API_TOKEN: ${REQUIRE_API_TOKEN:-false}
      LOG_DIR: /app/logs
      MODEL_ARTIFACT_PATH: /app/artifacts/risk_model.joblib
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./artifacts:/app/artifacts

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    depends_on:
      - api

  web:
    build:
      context: ./web
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://api:8000
      API_TOKEN: ${API_TOKEN:-dev-token}
    depends_on:
      - api
